name: Browser tool · Check and publish
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 9 5 * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Collect a fresh bounded GBIF snapshot
        type: boolean
        default: false
concurrency:
  group: museumdrawer-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Select collection mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          collect=false
          if [ "$REF" = refs/heads/main ] && { [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$REFRESH" = true ]; } || [ ! -f data/current.json ]; }; then collect=true; fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
      - name: Collect a fresh GBIF capture
        if: steps.mode.outputs.collect == 'true' 
        run: python3 scripts/collect.py
      - name: Test the application
        run: node --test tests/*.test.mjs
      - name: Test the builder
        run: python3 -m unittest discover -s tests -v
      - name: Build the static application
        run: python3 scripts/build.py
      - name: Check whether the tool has been initialized
        id: identity
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import json, os
          tool_id = json.load(open('tool.json'))['id']
          ready = tool_id != 'coolcode-tool-template' and tool_id == os.environ['REPOSITORY_NAME']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(ready).lower()}\n')
          PY
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check application in a browser
        run: python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Preserve validated captures in Git
        if: steps.mode.outputs.collect == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Archive validated GBIF occurrence capture"
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: browser-tool-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.identity.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
